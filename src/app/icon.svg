<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Black background -->
  <rect width="512" height="512" fill="#0a0a0a" rx="60"/>
  
  <!-- Car silhouette (top area) -->
  <g transform="translate(80, 100)">
    <!-- Car body -->
    <path d="M30 120 L50 70 Q80 40 180 38 Q280 36 310 70 L330 120 Z" fill="#F9B903" opacity="0.95"/>
    <!-- Car roof -->
    <path d="M80 70 Q100 35 180 33 Q260 31 280 70 Z" fill="#F9B903" opacity="0.85"/>
    <!-- Wheels -->
    <circle cx="85" cy="125" r="28" fill="#0a0a0a" stroke="#F9B903" stroke-width="6"/>
    <circle cx="275" cy="125" r="28" fill="#0a0a0a" stroke="#F9B903" stroke-width="6"/>
    <!-- Windshield highlight -->
    <path d="M100 68 L110 50 L200 48 L210 68 Z" fill="#0a0a0a" opacity="0.4"/>
  </g>

  <!-- "RS" text -->
  <text x="90" y="390" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="200" fill="#F9B903" letter-spacing="-8">RS</text>
  
  <!-- "TRAVEL" small text -->
  <text x="310" y="390" font-family="Arial, sans-serif" font-weight="700" font-size="52" fill="#ffffff" opacity="0.9">TRAVEL</text>
</svg>
